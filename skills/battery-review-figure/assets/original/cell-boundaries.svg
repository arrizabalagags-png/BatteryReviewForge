<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Original editable template comparing full, half, and symmetric cell boundaries">
  <rect width="1200" height="680" fill="#ffffff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#26343D}
    .heading{font-size:31px;font-weight:700}
    .body{font-size:21px}
    .note{font-size:17px;fill:#66747C}
    .card{stroke:#D8E0E4;stroke-width:2}
  </style>
  <text x="44" y="55" class="heading">What is inside the tested cell?</text>
  <text x="44" y="86" class="note">Editable schematic template. Replace generic labels and test boundaries before publication.</text>
  <g transform="translate(42 120)">
    <rect width="352" height="475" rx="20" fill="#EAF2F7" class="card"/>
    <text x="24" y="51" class="heading" font-size="27">Full cell</text>
    <text x="24" y="87" class="note">Two different active electrodes</text>
    <rect x="32" y="139" width="86" height="188" rx="12" fill="#205C85"/>
    <rect x="133" y="139" width="86" height="188" rx="12" fill="#ffffff" stroke="#A8B9C3" stroke-width="2"/>
    <rect x="234" y="139" width="86" height="188" rx="12" fill="#348678"/>
    <text x="75" y="350" class="body" text-anchor="middle">−</text>
    <text x="176" y="350" class="body" text-anchor="middle">S</text>
    <text x="277" y="350" class="body" text-anchor="middle">+</text>
    <text x="24" y="405" class="body">Negative | separator | positive</text>
    <text x="24" y="438" class="note">State electrode pair, N/P, loading,</text>
    <text x="24" y="461" class="note">electrolyte and energy boundary.</text>
  </g>
  <g transform="translate(424 120)">
    <rect width="352" height="475" rx="20" fill="#E9F4F0" class="card"/>
    <text x="24" y="51" class="heading" font-size="27">Half cell</text>
    <text x="24" y="87" class="note">Working electrode vs named metal</text>
    <rect x="32" y="139" width="86" height="188" rx="12" fill="#348678"/>
    <rect x="133" y="139" width="86" height="188" rx="12" fill="#ffffff" stroke="#A8B9C3" stroke-width="2"/>
    <rect x="234" y="139" width="86" height="188" rx="12" fill="#776B58"/>
    <text x="75" y="350" class="body" text-anchor="middle">W</text>
    <text x="176" y="350" class="body" text-anchor="middle">S</text>
    <text x="277" y="350" class="body" text-anchor="middle">M</text>
    <text x="24" y="405" class="body">Working | separator | metal</text>
    <text x="24" y="438" class="note">Name the metal and voltage window.</text>
    <text x="24" y="461" class="note">Do not imply full-cell energy.</text>
  </g>
  <g transform="translate(806 120)">
    <rect width="352" height="475" rx="20" fill="#F2EFF6" class="card"/>
    <text x="24" y="51" class="heading" font-size="27">Symmetric cell</text>
    <text x="24" y="87" class="note">Two nominally identical electrodes</text>
    <rect x="32" y="139" width="86" height="188" rx="12" fill="#8B6F9E"/>
    <rect x="133" y="139" width="86" height="188" rx="12" fill="#ffffff" stroke="#A8B9C3" stroke-width="2"/>
    <rect x="234" y="139" width="86" height="188" rx="12" fill="#8B6F9E"/>
    <text x="75" y="350" class="body" text-anchor="middle">A</text>
    <text x="176" y="350" class="body" text-anchor="middle">S</text>
    <text x="277" y="350" class="body" text-anchor="middle">A</text>
    <text x="24" y="405" class="body">A | separator | A</text>
    <text x="24" y="438" class="note">State current density, areal capacity,</text>
    <text x="24" y="461" class="note">pressure, time and failure rule.</text>
  </g>
  <text x="42" y="641" class="note">S = separator + electrolyte; W = working electrode; M = counter/reference metal. Illustrative only.</text>
</svg>
