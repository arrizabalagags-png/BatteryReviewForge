name: Publish checked skill release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check existing distribution and version
        run: python3 scripts/verify_distribution.py
      - name: Publish versioned archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open(".codex-plugin/plugin.json"))["version"])')
          CHANNEL=$(python3 -c 'import json; print(json.load(open("docs/RELEASE_STATUS.json"))["channel"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets."
            exit 1
          fi
          OPTIONS=()
          if [ "$CHANNEL" = "beta" ]; then
            OPTIONS+=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag "${OPTIONS[@]}" --title "BatteryReviewForge $TAG ($CHANNEL)" --notes-file "docs/RELEASE_$TAG.md" docs/downloads/*-v"$VERSION".zip docs/downloads/single/*-v"$VERSION".zip docs/downloads/workbuddy/*-v"$VERSION".zip docs/downloads/recipes/*-"$VERSION".zip docs/downloads/distribution-sha256.txt
